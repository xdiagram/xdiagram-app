<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>xdiagram</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      // Apply a theme forced in Settings before the first paint.
      try {
        const t = localStorage.getItem("xdiagram.theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
