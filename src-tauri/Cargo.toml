[workspace]
# Pure libraries the app uses, kept free of Tauri so other tools can use them too.
members = ["crates/join-paths", "crates/xdiagram-core", "crates/xdiagram-mcp"]

[package]
name = "xdiagram"
version = "0.4.1"
description = "Database diagrams from PostgreSQL, MySQL, SQL Server and SQLite, as editable DBML"
authors = ["the xdiagram authors"]
license = "AGPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xdiagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tauri-plugin-store = "2.5.1"
tauri-plugin-dialog = "2.8.4"
base64 = "0.23.1"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
join-paths = { path = "crates/join-paths" }
xdiagram-core = { path = "crates/xdiagram-core" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
