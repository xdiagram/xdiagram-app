[workspace]
# Pure libraries the app uses, kept free of Tauri so other tools can use them too.
members = ["crates/join-paths"]

[package]
name = "xdiagram"
version = "0.4.1"
description = "Database diagrams from PostgreSQL, MySQL, SQL Server and SQLite, as editable DBML"
authors = ["the xdiagram authors"]
license = "AGPL-3.0-or-later"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "xdiagram_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
thiserror = "2.0.21"
tauri-plugin-store = "2.5.1"
tauri-plugin-dialog = "2.8.4"
webpki-roots = "1.0.12"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
base64 = "0.23.1"
sqlparser = "0.64"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# SSH tunnels; ring instead of the default aws-lc (no C toolchain / cmake needed).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
join-paths = { path = "crates/join-paths" }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
