[package]
name = "xdiagram-core"
version = "0.1.0"
description = "xdiagram's database layer: connections, introspection and read-only queries; no Tauri"
edition = "2024"
license = "AGPL-3.0-or-later"
publish = false

[features]
# JSON Schemas of the request types (for tools that describe their inputs, such as xdiagram-mcp).
schema = ["dep:schemars"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "net", "time", "sync", "io-util"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = "0.14.0"
thiserror = "2.0.21"
webpki-roots = "1.0.12"
keyring = { version = "3", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
sqlparser = "0.64"
mysql_async = { version = "0.37", default-features = false, features = ["default-rustls-ring"] }
tiberius = { version = "0.13", default-features = false, features = ["tds73", "native-tls"] }
tokio-util = { version = "0.7", features = ["compat"] }
rusqlite = { version = "0.42", features = ["bundled"] }
# SSH tunnels; ring instead of the default aws-lc (no C toolchain / cmake needed).
russh = { version = "0.65", default-features = false, features = ["ring", "rsa", "flate2"] }
schemars = { version = "1", optional = true }
